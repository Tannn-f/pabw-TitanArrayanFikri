<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catatan Film</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="komponen.css" />
    <link rel="stylesheet" href="tema.css" />
  </head>
  <body>
    <header>
      <h1 id="judul-halaman"></h1>
      <p id="perkenalan"></p>
      <p id="genre-favorit"></p>
      <nav aria-label="Navigasi utama">
        <ul>
          <li><a href="#daftar-film">Daftar Film</a></li>
          <li><a href="#tambah-film">Tambah Film</a></li>
          <li><a href="#target-tontonan">Target Tontonan</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="daftar-film">
        <h2>Daftar Film</h2>
        <p id="ringkasan-film"></p>

        <figure>
          <img
            src="poster-film.webp"
            alt="Poster film Interstellar menampilkan seorang astronaut berdiri di lanskap planet es"
            width="640"
            height="360"
            loading="lazy"
          />
          <figcaption id="keterangan-poster"></figcaption>
        </figure>

        <table>
          <caption>
            Daftar Film yang Pernah Saya Tonton
          </caption>
          <thead>
            <tr>
              <th scope="col">Judul Film</th>
              <th scope="col">Sutradara</th>
              <th scope="col">Tahun Rilis</th>
              <th scope="col">Rating Saya</th>
            </tr>
          </thead>
          <tbody id="isi-tabel-film"></tbody>
        </table>
      </section>

      <section id="tambah-film">
        <h2>Tambah Film</h2>
        <form action="/simpan" method="post">
          <p>
            <label for="judul-film">Judul Film</label>
            <input type="text" id="judul-film" name="judul-film" required />
          </p>
          <p>
            <label for="tahun-rilis">Tahun Rilis</label>
            <input
              type="number"
              id="tahun-rilis"
              name="tahun-rilis"
              min="1888"
              max="2026"
              required
            />
          </p>
          <p>
            <label for="rating-film">Rating Saya (1-5)</label>
            <input
              type="number"
              id="rating-film"
              name="rating-film"
              min="1"
              max="5"
              step="0.1"
              required
            />
          </p>
          <button type="submit">Simpan</button>
        </form>
      </section>

      <section id="target-tontonan">
        <h2>Target Tontonan</h2>
        <p>
          Daftar film yang berencana saya tonton dalam waktu dekat beserta
          prioritasnya:
        </p>
        <ul id="daftar-target"></ul>
      </section>
    </main>

    <footer>
      <p id="kaki-halaman"></p>
    </footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
